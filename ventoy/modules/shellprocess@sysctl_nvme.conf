# ==============================================================================
# Calamares - shellprocess@sysctl_nvme.conf
# Otimizações de baixo nível de I/O NVMe síncrono, scheduler none e sysctl
# ==============================================================================
---
dontChroot: false
timeout: 60
script:
  # 1. Pipeline NVMe síncrono e TRIM no crypttab
  - 'sed -i -E '\''s/(luks,initramfs|luks)/\1,discard,no-read-workqueue,no-write-workqueue/'\'' /etc/crypttab'
  
  # 2. Desativa resume de hibernação no initramfs
  - 'mkdir -p /etc/initramfs-tools/conf.d && echo "RESUME=none" > /etc/initramfs-tools/conf.d/resume'
  
  # 3. Parâmetros de sysctl para SSDs e memória
  - |
    cat << 'EOF' > /etc/sysctl.d/99-nvme-performance.conf
    vm.swappiness = 100
    vm.dirty_background_ratio = 5
    vm.dirty_ratio = 10
    vm.vfs_cache_pressure = 50
    EOF

  # 4. Regra UDEV para scheduler 'none' em NVMe
  - 'mkdir -p /etc/udev/rules.d && echo '\''ACTION=="add|change", KERNEL=="nvme[0-9]*n[0-9]*", ATTR{queue/scheduler}="none"'\'' > /etc/udev/rules.d/60-nvme-scheduler.rules'
