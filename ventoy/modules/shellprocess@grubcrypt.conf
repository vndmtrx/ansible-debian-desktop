# ==============================================================================
# Calamares - shellprocess@grubcrypt.conf
# Configura o GRUB para suportar LUKS2, Btrfs, zswap e boot rápido de 1s de forma 100% idempotente
# (Executado antes do módulo bootloader do Calamares)
# ==============================================================================
---
dontChroot: false
timeout: 60
script:
  - |
    # 1. Habilita suporte a cryptodisk no GRUB
    if grep -q "^GRUB_ENABLE_CRYPTODISK=" /etc/default/grub; then
      sed -i 's/^GRUB_ENABLE_CRYPTODISK=.*/GRUB_ENABLE_CRYPTODISK=y/' /etc/default/grub
    else
      echo "GRUB_ENABLE_CRYPTODISK=y" >> /etc/default/grub
    fi

  - |
    # 2. Pré-carrega drivers essenciais na imagem EFI do GRUB (LUKS1)
    if grep -q "^GRUB_PRELOAD_MODULES=" /etc/default/grub; then
      sed -i 's/^GRUB_PRELOAD_MODULES=.*/GRUB_PRELOAD_MODULES="luks crypto gcry_rijndael gcry_sha256 btrfs"/' /etc/default/grub
    else
      echo 'GRUB_PRELOAD_MODULES="luks crypto gcry_rijndael gcry_sha256 btrfs"' >> /etc/default/grub
    fi

  - |
    # 3. Ativa zswap (zstd + zsmalloc)
    if ! grep -q "zswap.enabled=1" /etc/default/grub; then
      sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT="\(.*\)"/GRUB_CMDLINE_LINUX_DEFAULT="\1 zswap.enabled=1 zswap.compressor=zstd zswap.max_pool_percent=20 zswap.zpool=zsmalloc"/' /etc/default/grub
    fi

  - |
    # 4. Remove splash e ajusta timeout para 1s
    sed -i 's/\bsplash\b//g; s/  */ /g' /etc/default/grub
    if grep -q "^GRUB_TIMEOUT=" /etc/default/grub; then
      sed -i 's/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=1/' /etc/default/grub
    else
      echo "GRUB_TIMEOUT=1" >> /etc/default/grub
    fi
