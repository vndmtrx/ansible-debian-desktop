---
# sistema/handlers/main.yaml

# Handlers para ASDF reshim
- name: Reshim
  ansible.builtin.shell: |
    export ASDF_DATA_DIR="{{ asdf_data_dir }}"
    export PATH="$ASDF_DATA_DIR/shims:$HOME/.local/bin:$PATH"
    asdf reshim
  args:
    executable: /bin/bash
  become: false
  changed_when: true

# Handler para sincronização de metadados e chaves do Extrepo
- name: Atualiza metadados do extrepo
  ansible.builtin.command: extrepo update
  become: true
  changed_when: true
