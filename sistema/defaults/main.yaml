  - "{{ ansible_env.HOME }}/du/dev/github"
  - "{{ ansible_env.HOME }}/du/dev/docker-stacks"

# Aliases para o Bash
# Usado em: sistema/tasks/02-usuario.yaml
# Descrição dos aliases:
#   - Versões coloridas/modernas de comandos comuns:
#       ip, ls, grep, ll, eza
#   - Utilitários CLI e atalhos de produtividade:
#       ts: Visualizador de logs com highlight automático de sintaxe (tailspin)
#       vg: Atalho rápido para gerenciar VMs com o Vagrant
#       jc: Acompanha logs do systemd (journalctl -f) colorizados via tailspin
#       mtr: Diagnóstico interativo de latência/perda de pacotes em modo texto
#       rebootbios: Reinicia o sistema diretamente no setup do firmware UEFI/BIOS
#       bat: Visualizador de arquivos com syntax highlighting (Debian batcat)
#       fd: Busca ultrarrápida de arquivos e diretórios (Debian fdfind)
#       du: Análise gráfica e intuitiva de uso de disco (dust)
#   - Ambientes em containers descartáveis:
#       tensor: Sobe container interativo do Jupyter/TensorFlow na porta 8888 (--rm)
#       plantuml: Sobe servidor local Jetty do PlantUML na porta 8080 (--rm)
#   - Scripts locais de segurança e configuração:
#       salvar-extensoes: Exporta configurações ativas do dconf para ~/du/conf/
#       backup-seguranca: Cria backup comprimido e criptografado com GPG
#       restore-seguranca: Restaura dotfiles e chaves criptografadas no $HOME
aliases_bash:
  - 'ip="ip --color=auto"'
  - 'ls="eza --color=auto"'
  - 'grep="grep --color=auto"'
  - 'ts="tspin"'
  - 'll="ls -lah"'
  - 'vg="vagrant"'
  - 'jc="sudo journalctl -f | tspin"'
  - 'mtr="mtr -t"'
  - 'rebootbios="sudo systemctl reboot --firmware"'
  - 'eza="eza --color=auto"'
  - 'tensor="docker run -it --rm -p 8888:8888 -v $HOME/du/dev/tensor:/tf/notebooks tensorflow/tensorflow:latest-jupyter"'
  - 'plantuml="docker run -it --rm -p 8080:8080 plantuml/plantuml-server:jetty"'
  - 'salvar-extensoes="$HOME/.local/bin/salvar-extensoes"'
  - 'backup-seguranca="$HOME/.local/bin/backup-seguranca"'
  - 'restore-seguranca="$HOME/.local/bin/restore-seguranca"'

