---
# sistema/tasks/02-usuario.yaml

- name: Ajusta o LibreWolf para usar o touch
  ansible.builtin.lineinfile:
    path: /etc/security/pam_env.conf
    regexp: '^MOZ_USE_XINPUT2\b'
    line: MOZ_USE_XINPUT2 DEFAULT=1
  become: true

- name: Adiciona configuração do Tilix ao .bashrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} TILIX CONFIGURATION"
    block: |
      if [ $TILIX_ID ] || [ $VTE_VERSION ]; then
        if [ -f /etc/profile.d/vte.sh ]; then
          source /etc/profile.d/vte.sh
        elif [ -f /etc/profile.d/vte-2.91.sh ]; then
          source /etc/profile.d/vte-2.91.sh
        fi
      fi
    state: present
  become: false



- name: Configura limpeza automática da pasta Downloads
  ansible.builtin.cron:
    name: "Limpeza automática de arquivos antigos em Downloads"
    minute: "0"
    hour: "*"
    user: "{{ ansible_env.USER }}"
    job: 'find "$HOME/Downloads" -type f -mtime +30 -exec gio trash {} \; 2>/dev/null || true'
  become: false

- name: Garante diretórios de trabalho do usuário
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ diretorios_usuario }}"
  become: false

- name: Garante diretório .ssh com permissões seguras
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: '0700'
  become: false

- name: Garante existência da chave SSH id_ed25519
  community.crypto.openssh_keypair:
    path: "{{ ansible_env.HOME }}/.ssh/id_ed25519"
    type: ed25519
    comment: "{{ ssh_key_email }}"
    state: present
    mode: '0600'
  become: false

- name: Garante diretório do GNOME Keyring com permissões restritas
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/share/keyrings"
    state: directory
    mode: '0700'
  become: false

- name: Inicializa chaveiro login do GNOME Keyring sem senha
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/share/keyrings/login.keyring"
    content: |
      [keyring]
      display-name=login
      ctime=0
      mtime=0
      lock-on-idle=false
      lock-after=false
    force: false
    mode: '0600'
  become: false

- name: Define chaveiro login como padrão no GNOME Keyring
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/share/keyrings/default"
    content: "login\n"
    force: false
    mode: '0600'
  become: false

- name: Cria comando utilitário para backup de configurações das extensões e GNOME
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/bin/salvar-extensoes"
    content: |
      #!/usr/bin/env bash
      # Salva as configurações das extensões e preferências do desktop GNOME em ~/du/conf
      set -euo pipefail

      DEST_DIR="$HOME/du/conf"
      TIMESTAMP=$(date +%Y%m%d%H%M%S)

      mkdir -p "$DEST_DIR"
      dconf dump /org/gnome/shell/extensions/ > "$DEST_DIR/extensoes_${TIMESTAMP}.dconf"
      dconf dump /org/gnome/desktop/background/ > "$DEST_DIR/background_${TIMESTAMP}.dconf"
      dconf dump /org/gnome/desktop/interface/ > "$DEST_DIR/interface_${TIMESTAMP}.dconf"
      dconf dump /org/gnome/desktop/wm/ > "$DEST_DIR/janelas_${TIMESTAMP}.dconf"
      dconf dump /org/gnome/mutter/ > "$DEST_DIR/mutter_${TIMESTAMP}.dconf"
      dconf dump /org/gnome/settings-daemon/plugins/media-keys/ > "$DEST_DIR/atalhos_${TIMESTAMP}.dconf"

      echo "✅ Configurações salvas cirurgicamente em $DEST_DIR:"
      echo "   📄 Extensões: extensoes_${TIMESTAMP}.dconf"
      echo "   📄 Janelas & Atalhos: janelas_${TIMESTAMP}.dconf / atalhos_${TIMESTAMP}.dconf"
      echo "   📄 Interface & Tema: interface_${TIMESTAMP}.dconf / background_${TIMESTAMP}.dconf"
    mode: '0755'
  become: false

- name: Garante permissões restritas no diretório de backups
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/du/backups"
    state: directory
    mode: '0700'
  become: false

- name: Cria links para utilitários de backup e restore de segurança
  ansible.builtin.file:
    src: "{{ playbook_dir }}/{{ item.src }}"
    dest: "{{ ansible_env.HOME }}/.local/bin/{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: "backup.sh", dest: "backup-seguranca" }
    - { src: "restore.sh", dest: "restore-seguranca" }
  become: false

- name: Configura aliases para Bash
  become: false
  block:
    - name: Verificar se .bashrc possui configuração de aliases
      ansible.builtin.command:
        cmd: grep -q "if \[ -f ~/.bash_aliases \]" {{ ansible_env.HOME }}/.bashrc
      register: bashrc_check
      changed_when: false
      failed_when: false

    - name: Adiciona aliases
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.bash_aliases"
        regexp: '^alias {{ (item.split("=")[0]) | regex_escape }}='
        line: 'alias {{ item }}'
        state: present
        create: true
        mode: '0644'
      loop: "{{ aliases_bash }}"
      when: bashrc_check.rc == 0
  rescue:
    - name: Falha se .bashrc não estiver configurado corretamente
      ansible.builtin.fail:
        msg: "O .bashrc não possui a configuração padrão para carregar .bash_aliases"
      when: bashrc_check.rc != 0
