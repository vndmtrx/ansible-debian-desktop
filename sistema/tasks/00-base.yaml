---
# sistema/tasks/00-base.yaml
# yamllint disable rule:line-length

- name: Configura o TZ para o Brasil
  community.general.timezone:
    name: America/Sao_Paulo
  become: true

- name: Garante suporte ao formato DEB822 (python3-debian)
  ansible.builtin.apt:
    name: python3-debian
    state: present
  become: true

- name: Desativa repositórios legados do /etc/apt/sources.list para migração DEB822
  ansible.builtin.copy:
    dest: /etc/apt/sources.list
    content: |
      # Repositórios migrados para o formato DEB822 em /etc/apt/sources.list.d/
    mode: '0644'
    owner: root
    group: root
    backup: true
  become: true

- name: Configura repositório oficial do Debian Trixie (DEB822)
  ansible.builtin.deb822_repository:
    name: debian
    types:
      - deb
      - deb-src
    uris:
      - http://deb.debian.org/debian/
    suites:
      - trixie
      - trixie-updates
    components:
      - main
      - contrib
      - non-free
      - non-free-firmware
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
    state: present
    enabled: true
  become: true

- name: Configura repositório de segurança do Debian Trixie (DEB822)
  ansible.builtin.deb822_repository:
    name: debian-security
    types:
      - deb
      - deb-src
    uris:
      - http://security.debian.org/debian-security/
    suites:
      - trixie-security
    components:
      - main
      - contrib
      - non-free
      - non-free-firmware
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
    state: present
    enabled: true
  become: true

- name: Atualiza cache do apt
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: atualiza_sistema | bool

- name: Realiza atualização completa do sistema
  ansible.builtin.apt:
    upgrade: full
    autoremove: true
    autoclean: true
  become: true
  when: atualiza_sistema | bool

- name: Instala aplicações de sistema
  ansible.builtin.apt:
    name: "{{ pacotes_sistema }}"
    state: present
  become: true

- name: Instala utilitários de diagnóstico de hardware e sistema
  ansible.builtin.apt:
    name: "{{ utilitarios_hardware }}"
    state: present
  become: true


- name: Instala ferramentas para suporte a leitor biométrico (digitais)
  ansible.builtin.apt:
    name: "{{ pacotes_biometria }}"
    state: present
  become: true

- name: Verifica se a autenticação biométrica (PAM fprintd) já está ativa
  ansible.builtin.command:
    cmd: grep -q "pam_fprintd.so" /etc/pam.d/common-auth
  register: pam_fprintd_check
  changed_when: false
  failed_when: false

- name: Habilita autenticação biométrica no PAM via pam-auth-update
  ansible.builtin.command:
    cmd: pam-auth-update --enable fprintd
  environment:
    DEBIAN_FRONTEND: noninteractive
  become: true
  when: pam_fprintd_check.rc != 0

- name: Habilita serviços e timers de integridade do sistema
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ servicos_sistema }}"
  become: true

- name: Mascara serviços para eliminar bloqueios durante o boot
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop: "{{ servicos_mascarados }}"
  become: true

- name: Desabilita serviços desnecessários de espera de rede
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
  loop: "{{ servicos_desabilitados }}"
  become: true

- name: Permite conexões SSH no firewall
  community.general.ufw:
    rule: allow
    name: OpenSSH
  become: true

- name: Instala aplicações relacionados a terminal
  ansible.builtin.apt:
    name: "{{ apps_terminal }}"
    state: present
  become: true

- name: Instala aplicações de uso gráfico
  ansible.builtin.apt:
    name: "{{ apps_gui }}"
    state: present
  become: true

- name: Cria link simbólico para script do VTE do Tilix
  ansible.builtin.file:
    src: /etc/profile.d/vte-2.91.sh
    dest: /etc/profile.d/vte.sh
    state: link
  become: true

- name: Configura prompt vermelho e suporte a cores para o root no .bashrc
  ansible.builtin.blockinfile:
    path: /root/.bashrc
    marker: "# {mark} ANSIBLE ROOT PROMPT CONFIGURATION"
    create: true
    mode: '0644'
    block: |
      # Prompt com destaque em vermelho para o superusuário root
      export PS1='${debian_chroot:+($debian_chroot)}\[\033[01;31m\]\u@\h\[\033[00m\]:\[\033[01;34m\]\w\[\033[00m\]\$ '
      export LS_OPTIONS='--color=auto'
      eval "$(dircolors)"
      alias ls='ls $LS_OPTIONS'
      alias ll='ls $LS_OPTIONS -lah'
      alias grep='grep --color=auto'
      alias ip='ip --color=auto'
      if [ $TILIX_ID ] || [ $VTE_VERSION ]; then
        if [ -f /etc/profile.d/vte.sh ]; then
          source /etc/profile.d/vte.sh
        elif [ -f /etc/profile.d/vte-2.91.sh ]; then
          source /etc/profile.d/vte-2.91.sh
        fi
      fi
  become: true

- name: Instala repositório Flathub
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
  become: true

- name: Instala aplicações do Flatpak
  community.general.flatpak:
    name: "{{ item }}"
    state: present
    method: system
  loop: "{{ apps_flatpak }}"
  become: true
