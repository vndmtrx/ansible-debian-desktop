---
# sistema/tasks/00-base.yaml
# yamllint disable rule:line-length

- name: Configura o TZ para o Brasil
  community.general.timezone:
    name: America/Sao_Paulo
  become: true

- name: Verifica status do NTP
  ansible.builtin.command: timedatectl show --property=NTP --value
  register: ntp_status
  changed_when: false
  become: true

- name: Habilita sincronização de hora via NTP
  ansible.builtin.command: timedatectl set-ntp true
  become: true
  when: ntp_status.stdout != 'yes'

- name: Garante suporte ao formato DEB822 (python3-debian)
  ansible.builtin.apt:
    name: python3-debian
    state: present
  become: true

- name: Configura repositório oficial do Debian Trixie (DEB822)
  ansible.builtin.deb822_repository:
    name: debian
    types:
      - deb
      - deb-src
    uris:
      - http://deb.debian.org/debian/
    suites:
      - trixie
      - trixie-updates
    components:
      - main
      - contrib
      - non-free
      - non-free-firmware
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
    state: present
    enabled: true
  become: true

- name: Configura repositório de segurança do Debian Trixie (DEB822)
  ansible.builtin.deb822_repository:
    name: debian-security
    types:
      - deb
      - deb-src
    uris:
      - http://security.debian.org/debian-security/
    suites:
      - trixie-security
    components:
      - main
      - contrib
      - non-free
      - non-free-firmware
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
    state: present
    enabled: true
  become: true

- name: Atualiza cache do apt
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: atualiza_sistema | bool

- name: Realiza atualização completa do sistema
  ansible.builtin.apt:
    upgrade: full
    autoremove: true
    autoclean: true
  become: true
  when: atualiza_sistema | bool

- name: Instala aplicações de sistema
  ansible.builtin.apt:
    name: "{{ pacotes_sistema }}"
    state: present
  become: true

- name: Instala utilitários de diagnóstico de hardware e sistema
  ansible.builtin.apt:
    name: "{{ utilitarios_hardware }}"
    state: present
  become: true

- name: Identifica dispositivo montado em /boot/efi
  ansible.builtin.set_fact:
    efi_device_path: "{{ (ansible_mounts | selectattr('mount', 'equalto', '/boot/efi') | map(attribute='device') | first | default('')) }}"

- name: Gerenciamento da flag ESP na partição EFI
  when: efi_device_path != ''
  block:
    - name: Extrai disco base e número da partição EFI
      ansible.builtin.set_fact:
        efi_disk: "{{ efi_device_path | regex_replace('p?[0-9]+$', '') }}"
        efi_part_num: "{{ efi_device_path | regex_search('[0-9]+$') | int }}"

    - name: Garante que a partição EFI possua a flag esp ativa
      community.general.parted:
        device: "{{ efi_disk }}"
        number: "{{ efi_part_num }}"
        flags:
          - esp
        state: present
      register: efi_flag_res
      become: true

    - name: Recarrega subsistema de blocos do udev e reinicia fwupd se a flag foi alterada
      when: efi_flag_res.changed
      become: true
      block:
        - name: Notifica subsistema de blocos do udev
          ansible.builtin.command: udevadm trigger --subsystem-match=block
          changed_when: true

        - name: Reinicia serviço fwupd
          ansible.builtin.systemd_service:
            name: fwupd
            state: restarted

- name: Atualiza metadados do fwupd (LVFS)
  ansible.builtin.command: fwupdmgr refresh --force
  changed_when: false
  become: true
  when: atualiza_firmware | default(false) | bool

- name: Aplica atualizações de firmware pendentes
  ansible.builtin.command: fwupdmgr update -y
  register: fwupd_result
  failed_when:
    - fwupd_result.rc != 0
    - "'No updatable devices' not in fwupd_result.stderr"
    - "'nothing to do' not in fwupd_result.stderr | lower"
    - "'no updates' not in fwupd_result.stdout | lower"
  changed_when:
    - "'Successfully installed firmware' in fwupd_result.stdout or 'An update requires a reboot' in fwupd_result.stdout"
  become: true
  when: atualiza_firmware | default(false) | bool

- name: Instala ferramentas para suporte a leitor biométrico (digitais)
  ansible.builtin.apt:
    name: "{{ pacotes_biometria }}"
    state: present
  become: true

- name: Habilita serviços e timers de integridade do sistema
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ servicos_sistema }}"
  become: true

- name: Mascara serviços para eliminar bloqueios durante o boot
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop: "{{ servicos_mascarados }}"
  become: true

- name: Desabilita serviços desnecessários de espera de rede
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
  loop: "{{ servicos_desabilitados }}"
  become: true

- name: Permite conexões SSH no firewall
  community.general.ufw:
    rule: allow
    name: OpenSSH
  become: true

- name: Instala aplicações relacionados a terminal
  ansible.builtin.apt:
    name: "{{ apps_terminal }}"
    state: present
  become: true

- name: Instala aplicações de uso gráfico
  ansible.builtin.apt:
    name: "{{ apps_gui }}"
    state: present
  become: true

- name: Cria link simbólico para script do VTE do Tilix
  ansible.builtin.file:
    src: /etc/profile.d/vte-2.91.sh
    dest: /etc/profile.d/vte.sh
    state: link
  become: true

- name: Instala repositório Flathub
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
  become: true

- name: Instala aplicações do Flatpak
  community.general.flatpak:
    name: "{{ item }}"
    state: present
    method: system
  loop: "{{ apps_flatpak }}"
  become: true
