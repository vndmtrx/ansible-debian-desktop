---
# sistema/tasks/04-asdf-shims.yaml

# Dependências específicas para compilação do Erlang e execução do Elixir
- name: Instala dependências dos plugins do ASDF (Erlang e Elixir)
  ansible.builtin.apt:
    name:
      - build-essential
      - autoconf
      - libncurses-dev
      - libssl-dev
      - zlib1g-dev
      - libwxgtk3.2-dev
      - libgl1-mesa-dev
      - libglu1-mesa-dev
      - libpng-dev
    state: present
  become: true

- name: Define ASDF_DATA_DIR
  ansible.builtin.set_fact:
    asdf_data_dir: "{{ ansible_env.HOME }}/.asdf"
  become: false

# Verificação e instalação dos plugins
- name: Verifica se o plugin Erlang do ASDF está instalado
  ansible.builtin.stat:
    path: "{{ asdf_data_dir }}/plugins/erlang"
  register: asdf_erlang_plugin_stat
  become: false

- name: Adiciona plugin do Erlang
  ansible.builtin.shell: |
    export ASDF_DATA_DIR="{{ asdf_data_dir }}"
    export PATH="$ASDF_DATA_DIR/shims:$HOME/.local/bin:$PATH"
    asdf plugin add erlang
  args:
    executable: /bin/bash
  when: not asdf_erlang_plugin_stat.stat.exists
  become: false

- name: Verifica se o plugin Elixir do ASDF está instalado
  ansible.builtin.stat:
    path: "{{ asdf_data_dir }}/plugins/elixir"
  register: asdf_elixir_plugin_stat
  become: false

- name: Adiciona plugin do Elixir
  ansible.builtin.shell: |
    export ASDF_DATA_DIR="{{ asdf_data_dir }}"
    export PATH="$ASDF_DATA_DIR/shims:$HOME/.local/bin:$PATH"
    asdf plugin add elixir
  args:
    executable: /bin/bash
  when: not asdf_elixir_plugin_stat.stat.exists
  become: false

# Verificação e instalação do Erlang
- name: Verifica se a versão do Erlang já está compilada
  ansible.builtin.stat:
    path: "{{ asdf_data_dir }}/installs/erlang/{{ versao_erlang }}"
  register: asdf_erlang_version_stat
  become: false

- name: Instala versão do Erlang via ASDF
  ansible.builtin.shell: |
    export ASDF_DATA_DIR="{{ asdf_data_dir }}"
    export PATH="$ASDF_DATA_DIR/shims:$HOME/.local/bin:$PATH"
    asdf install erlang {{ versao_erlang }}
  args:
    executable: /bin/bash
  when: not asdf_erlang_version_stat.stat.exists
  notify: Reshim
  become: false

# Verificação e instalação do Elixir
- name: Verifica se a versão do Elixir já está instalada
  ansible.builtin.stat:
    path: "{{ asdf_data_dir }}/installs/elixir/{{ versao_elixir }}"
  register: asdf_elixir_version_stat
  become: false

- name: Instala versão do Elixir via ASDF
  ansible.builtin.shell: |
    export ASDF_DATA_DIR="{{ asdf_data_dir }}"
    export PATH="$ASDF_DATA_DIR/shims:$HOME/.local/bin:$PATH"
    asdf install elixir {{ versao_elixir }}
  args:
    executable: /bin/bash
  when: not asdf_elixir_version_stat.stat.exists
  notify: Reshim
  become: false

# Configuração de versões globais via .tool-versions (100% idempotente)
- name: Define versão global do Erlang em .tool-versions
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.tool-versions"
    regexp: '^erlang\s+'
    line: "erlang {{ versao_erlang }}"
    create: true
    mode: '0644'
  notify: Reshim
  become: false

- name: Define versão global do Elixir em .tool-versions
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.tool-versions"
    regexp: '^elixir\s+'
    line: "elixir {{ versao_elixir }}"
    create: true
    mode: '0644'
  notify: Reshim
  become: false

- name: Executa handlers pendentes
  ansible.builtin.meta: flush_handlers
